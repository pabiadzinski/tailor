[package]
name = "tailr"
version = "0.4.0"
edition = "2024"

[dependencies]
axum = "0.8"
bollard = "0.21"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
regex = "1.13.1"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.6"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
